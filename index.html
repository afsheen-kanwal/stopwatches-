<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
margin-top: 50px;
}

.main {
    border: 5px groove black;
    border-radius: 30px;
    background-color: rgb(213, 242, 146);
    width: 350px;
    padding: 20px;
    text-align: center;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
}

.time {
    font-size: 35px;
    font-weight: bold;
    margin: 20px 0;
    background: white;
    padding: 10px;
    border-radius: 15px;
    border: 2px solid #ccc;
}

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 5px;
}

button {
    flex: 1;
    padding: 10px;
    font-size: medium;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    transition: 0.2s;
}

#startBtn {
    background-color: brown;
}

button:nth-child(2) {
    background-color: rgb(76, 180, 16);
}

button:nth-child(3) {
    background-color: rgb(38, 77, 251);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Responsive for Mobile */
@media (max-width: 480px) {
    .main {
        width: 90%;
    }
    .buttons {
        flex-direction: column;
        gap: 10px;
    }
}
</style>
</head>
<body>

    <div class="main">
        <div class="head">
            <h1>STOPWATCH 🕓🕤</h1>
        </div>
        <div class="time">
            <span id="min">00</span> :
            <span id="sec">00</span> :
            <span id="msec">00</span>
        </div>
        <div class="buttons">
            <button id="startBtn" onclick="startTimer()">Start</button>
            <button onclick="stopTimer()">Stop</button>
            <button onclick="resetTimer()">Reset</button>
        </div>
    </div>
  

    <script src="app.js"></script>
</body>
</html>
